services:
  db-payment:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      - POSTGRES_USER=user_payment
      - POSTGRES_PASSWORD=pass_payment
      - POSTGRES_DB=payment_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_payment -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build: .
    container_name: payment-api
    depends_on:
      db-payment:
        condition: service_healthy
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user_payment:pass_payment@db-payment:5432/payment_db
