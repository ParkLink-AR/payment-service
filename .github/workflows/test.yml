name: Test and Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint:security

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      # A Codecov outage or TLS hiccup must never fail CI -- fail_ci_if_error alone doesn't
      # cover errors the action hits before uploading (e.g. fetching its CLI).
      continue-on-error: true
      with:
        directory: ./coverage/
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
